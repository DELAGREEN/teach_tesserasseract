version: "3.8"

services:
  ocr_app:
    build:
      context: ../../
      dockerfile: docker/astralinux/Dockerfile
    container_name: astralinux_ocr_app
    user: "${UID}:${GID}"
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - MONITORED_DIR=/app/pdf
    volumes:
      # Монтируем файлы приложения
      #- ../../app.py:/app/app.py
      #- ../../logger.py:/app/logger.py
      #- ../../config.ini:/app/config.ini
      
      # Каталог для мониторинга PDF
      - type: bind
        source: ${HOST_MONITORED_DIR:-../pdf}
        target: ${CONTAINER_MONITORED_DIR:-/app/pdf}
        consistency: consistent
      
      # Директории для результатов обработки
      #- ../../results:/app/results
      #- ../../tresh:/app/tresh
      #- ../../processed:/app/processed
      
      # Монтирование настроек времени
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      
    network_mode: host
    restart: unless-stopped